experiment_id: zinc-graphgps

model:
  hidden_dim: 64
  num_heads: 4
  attn_dropout: 0.5
  dropout: 0.0

architecture:
  num_layers: 10
  mpnn: gine
  task: regression

pe:
  type: rwse
  dim: 28

vnode:
  enabled: false
  num_node_types: 28
  num_edge_types: 4
  vnode_node_type: 28
  vnode_edge_type: 4

data:
  dataset: zinc
  batch_size: 32
  num_workers: 4
  root: data

training:
  epochs: 1500
  warmup_epochs: 50
  lr: 0.001
  weight_decay: 1.0e-5
  grad_clip: 1.0

diagnostics:
  enabled: true
  max_graphs: 200

logging:
  wandb_project: graph-transformer-sinks
  save_dir: outputs
